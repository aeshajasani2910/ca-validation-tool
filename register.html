<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CA Validation Tool</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">

</head>

<body>

<div class="register-container">

   

    <div class="left-panel">

        <div class="left-content">

            <i class="bi bi-shield-check display-2 mb-4"></i>

            <h1>CA Validation Tool</h1>

            <p class="mt-3">

                Secure Government Document Validation Platform

            </p>

            <div class="feature-box mt-5">

                <div class="feature">

                    <i class="bi bi-patch-check-fill"></i>

                    <span>PAN Card Validation</span>

                </div>

                <div class="feature">

                    <i class="bi bi-patch-check-fill"></i>

                    <span>GSTIN Verification</span>

                </div>

                <div class="feature">

                    <i class="bi bi-patch-check-fill"></i>

                    <span>Aadhaar Validation</span>

                </div>

                <div class="feature">

                    <i class="bi bi-patch-check-fill"></i>

                    <span>Email & Mobile Validation</span>

                </div>

                <div class="feature">

                    <i class="bi bi-patch-check-fill"></i>

                    <span>Export Report</span>

                </div>

                <div class="feature">

                    <i class="bi bi-patch-check-fill"></i>

                    <span>Validation History</span>

                </div>

            </div>

        </div>

    </div>

  

    <div class="right-panel">

        <div class="login-card">

            <div class="text-center">

                <div class="logo-box">

                    <i class="bi bi-person-plus-fill"></i>

                </div>

                <h2 class="mt-3">

                    Create Account

                </h2>

                <p>

                    Create your secure account

                </p>

            </div>

            <form id="registerForm">

                <div class="row">

                    <div class="col-md-4">

                        <label class="form-label">

                            First Name

                        </label>

                        <input
                            type="text"
                            id="fname"
                            class="form-control"
                            placeholder="First Name">

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">

                            Middle Name

                        </label>

                        <input
                            type="text"
                            id="mname"
                            class="form-control"
                            placeholder="Middle Name">

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">

                            Last Name

                        </label>

                        <input
                            type="text"
                            id="lname"
                            class="form-control"
                            placeholder="Last Name">

                    </div>

                </div>

                <div class="mt-3">

                    <label class="form-label">

                        Email Address

                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter Email">

                </div>

                <div class="mt-3">

                    <label class="form-label">

                        Mobile Number

                    </label>

                    <input
                        type="text"
                        id="mobile"
                        class="form-control"
                        placeholder="Enter Mobile Number">

                                        </div>

                <div class="mt-3">

                    <label class="form-label">

                        Password

                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Create Password">

                        <i class="bi bi-eye-slash-fill"
                           id="togglePassword"></i>

                    </div>

                </div>

                <div class="mt-3">

                    <label class="form-label">

                        Confirm Password

                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Confirm Password">

                        <i class="bi bi-eye-slash-fill"
                           id="toggleConfirmPassword"></i>

                    </div>

                </div>

                

            

                <div class="form-check mt-3">

    <input
        class="form-check-input"
        type="checkbox"
        id="terms">

    <label
        class="form-check-label"
        for="terms">

        I agree to the Terms & Conditions

    </label>

</div>

                <button
                    type="submit"
                    class="btn btn-primary w-100 mt-4">

                    <i class="bi bi-person-plus-fill"></i>

                    Create Account

                </button>

                <div class="signup-text">

                    Already have an account?

                    <a href="login.html">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Login

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>



<div id="toast" class="toast">
    Account Created Successfully ✅
</div>


<script src="register.js"></script>

</body>

</html>
